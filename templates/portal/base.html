<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}PZB{% endblock %}</title><link rel="icon" href="/fav.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/portal.css"></head><body class="portal"><div class="portal-shell"><nav class="portal-nav"><a class="portal-brand" href="/"><img src="/pzb-logo.png" alt="PZB logo">PZB</a><div class="portal-nav__links">{% if current_user.is_authenticated %}<a href="/home">Home</a><a href="/profile">Profile</a><form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Log out</button></form>{% else %}<a href="/login">Log in</a><a class="nav-pill" href="/join">Join PZB</a>{% endif %}</div></nav>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
